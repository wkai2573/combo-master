# 戰績伺服器（Cloudflare Workers + D1）。部署與設定步驟見 README 的「戰績伺服器」一節。
name = "combo-master-records"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 問卷的目的網址：遊戲的問卷按鈕永遠連 <Worker 網址>/feedback，要換問卷只改這一行再執行 bun run server:deploy
[vars]
FEEDBACK_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdZCBK4IwEDImkazrXJIiOwtLfNalrq8gkWlRmrFD0XQ99ycQ/viewform"

[[d1_databases]]
binding = "DB"
database_name = "combo-master-records"
# 建立資料庫（wrangler d1 create）回報的 database_id
database_id = "369d15da-08e1-4e41-9398-504a8f992f93"
